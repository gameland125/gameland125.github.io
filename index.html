<!DOCTYPE html>

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gameland">
    <meta name="description" content="Gameland PS4 9.00/9.03 Offline-First PWA">
    <meta name="format-detection" content="telephone=no">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">

    <title>GAMELAND</title>

    <link rel="manifest" href="./PSFree.manifest">
    <link rel="icon" href="./includes/css/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./includes/css/icons/icon-192.png">

    <link rel="stylesheet" href="./includes/css/layouts/index.css">
    <link rel="stylesheet" href="./includes/css/layouts/compact.css">
    <link rel="stylesheet" href="./includes/css/colors/default.css">
    <link rel="stylesheet" href="./includes/css/colors/vibrant.css">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (const registration of registrations) {
                    registration.unregister();
                }
            }).catch(function() {});
        }
    </script>
</head>
<body>
    <div id="main">
        <header id="header">
            <h1 id="title">GAMELAND</h1>
            <div id="subtitle">Powered by Qassem Akbarzadeh</div>
        </header>

        <main id="content">
            <div id="progressContainer">
                <div id="progressText">Loading...</div>
                <div id="progressBarWrap">
                    <div id="progressBar"></div>
                </div>
            </div>

            <div id="statusArea">
                <div id="fwStatus"></div>
                <div id="cacheStatus"></div>
            </div>

            <div id="menu"></div>
        </main>

        <footer id="footer">
            <div id="footerLeft">کاشمر، خیابان ترابی ۱۵</div>
            <div id="footerRight">09364229748</div>
        </footer>
    </div>

    <div id="retryModal" class="hidden">
        <div class="modalBox">
            <div class="modalTitle">Retry Required</div>
            <div class="modalText">Three failed attempts detected.</div>
            <div class="modalButtons">
                <button id="retryBtn">Retry</button>
                <button id="restartBtn">Restart</button>
                <button id="continueBtn">Continue</button>
            </div>
        </div>
    </div>

    <script>
        window.GAMELAND = {
            name: 'Gameland',
            operator: 'Qassem Akbarzadeh',
            location: 'کاشمر، خیابان ترابی ۱۵',
            phone: '09364229748',
            defaultLang: 'fa'
        };
    </script>

    <script src="./includes/payloads/payloads.js"></script>
    <script src="./includes/js/payloadsList.js"></script>
    <script src="./includes/js/design.js"></script>
    <script src="./includes/js/language.js"></script>
    <script src="./includes/js/HENs.js"></script>
    <script src="./includes/js/checkFw.js"></script>
    <script src="./includes/js/autoJbRetry.js"></script>
    <script src="./includes/js/events.js"></script>

    <script>
        function startAppWhenReady() {
            if (typeof loadSettings === 'function') {
                loadSettings();
            }
        }

        function isAppCacheReady(appCache) {
            if (!appCache) return true;
            return (
                appCache.status === appCache.UNCACHED ||
                appCache.status === appCache.IDLE ||
                appCache.status === appCache.UPDATEREADY
            );
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.applicationCache) {
                const appCache = window.applicationCache;

                const startOnce = () => {
                    if (!window.__gamelandStarted) {
                        window.__gamelandStarted = true;
                        startAppWhenReady();
                    }
                };

                if (isAppCacheReady(appCache)) {
                    startOnce();
                } else {
                    appCache.addEventListener('cached', startOnce, { once: true });
                    appCache.addEventListener('updateready', startOnce, { once: true });
                    appCache.addEventListener('noupdate', startOnce, { once: true });
                }

                appCache.addEventListener('progress', DLProgress, false);
                appCache.oncached = function () { DisplayCacheProgress(); };
                appCache.onupdateready = function () { DisplayCacheProgress(); };
            } else {
                startAppWhenReady();
            }
        });
    </script>
</body>
</html>
