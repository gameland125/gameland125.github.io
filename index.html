
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Gameland - PS4 Exploit Host</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; text-align: center; font-family: 'Tahoma', sans-serif; }
        .container { padding: 20px; border: 2px solid #ff00aa; margin: 20px; border-radius: 15px; }
        .branding { color: #ff00aa; font-weight: bold; margin-bottom: 20px; }
        .progress-container { width: 80%; margin: 20px auto; background: #333; height: 30px; border-radius: 15px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #ff00aa; transition: width 0.5s; }
        #goldhen-btn { background: #ff00aa; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2em; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GAMELAND</h1>
        <div class="branding">قاسم اکبرزاده | کاشمر، خیابان ترابی ۱۵ | 09364229748</div>
        <div id="loading-overlay">
            <p>لطفاً منتظر بمانید تا کش نصب شود...</p>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div id="perc">0%</div>
        </div>
        <button id="goldhen-btn" style="display:none;" onclick="runGoldHEN()">اجرای GoldHEN</button>
    </div>
    <script>
        // Placeholder for core logic connection
        function DLProgress(e) {
            let p = Math.round((e.loaded / e.total) * 100);
            document.getElementById('progress-bar').style.width = p + '%';
            document.getElementById('perc').innerText = p + '%';
            if(p >= 100) document.getElementById('goldhen-btn').style.display = 'inline-block';
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
    </script>
</body>
</html>
