<!DOCTYPE html>
<html lang="fa" manifest="PSFree.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameland PS4 Jailbreak</title>
    <link rel="stylesheet" href="./includes/css/layouts/index.css">
    <link rel="stylesheet" href="./includes/css/colors/vibrant.css">
    <script>
        var savedTheme = "index";
        var savedColor = "vibrant";
    </script>
    <script src="./includes/js/cacheGate.js"></script>
    <style>
        .hidden { display: none !important; }
        .countdown-text {
            color: #ffb3d9 !important;
            font-size: clamp(3rem, 10vw, 6rem) !important;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 179, 217, 0.4);
            margin: 20px 0;
            display: block;
        }
        #retry-limit-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 5, 12, 0.9);
            padding: 20px;
        }
        #retry-limit-modal .modal-content {
            background: #25122b;
            border: 2px solid #ff80bf;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 128, 191, 0.3);
        }
        #retry-limit-modal h2 {
            color: #ff80bf;
            margin-bottom: 15px;
            font-size: 24px;
        }
        #retry-limit-modal p {
            color: #ffd6eb;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.6;
        }
        #retry-limit-modal button {
            background: #ff80bf;
            color: #120516;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #retry-limit-modal button:hover {
            background: #ffb3d9;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="initial-screen">
            <header>
                <h1 style="color: #ff80bf; font-size: 28px; margin-top: 20px;">گیم لند (Gameland)</h1>
                <p style="color: #a68ba8; font-size: 14px;">مدیریت: قاسم اکبرزاده - کاشمر، درابی ۱۵ (۰۹۳۶۴۲۲۹۷۴۸)</p>
            </header>

            <div id="main-content" style="margin-top: 40px;">
                <div id="click-to-start-text" class="countdown-text">در حال بررسی کش...</div>
                <div id="status-message" style="color: #ffd6eb; font-size: 18px; margin-top: 10px;">لطفاً منتظر بمانید...</div>
                
                <button id="stopAutoJbBtn" class="hidden" style="margin-top: 20px; background: #4a1d52; color: #ffb3d9; border: 1px solid #ff80bf; padding: 10px 20px; border-radius: 5px; cursor: pointer;">توقف اجرای خودکار</button>
            </div>
            
            <!-- Hidden elements to maintain compatibility with baseline index.js references -->
            <div class="hidden">
                <span id="PS4FW">9.00</span>
                <span id="scrollDown"></span>
                <section id="exploit-main-screen"></section>
                <div id="console"></div>
            </div>
        </div>
    </div>

    <!-- Retry Limit Modal -->
    <div id="retry-limit-modal" class="hidden">
        <div class="modal-content">
            <h2>خطا در اجرای جیلبریک</h2>
            <p>فرآیند جیلبریک ۳ بار با خطا مواجه شد. لطفاً حافظه فلش را مجدداً متصل کنید یا دستگاه را ریستارت نمایید.</p>
            <button onclick="restartAfterRetryLimit()">تلاش مجدد</button>
        </div>
    </div>

    <script src="./includes/payloads/payloads.js"></script>
    <script src="./includes/js/payloadsList.js"></script>
    <script src="./includes/js/design.js"></script>
    <script src="./includes/js/language.js"></script>
    <script src="./includes/js/HENs.js"></script>
    <script src="./includes/js/checkFw.js"></script>
    <script src="./includes/js/autoJbRetry.js"></script>
    <script src="./includes/js/events.js"></script>
    <script src="./includes/js/index.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.applicationCache) {
                window.applicationCache.addEventListener("progress", function(e) {
                    var percent = e.total ? Math.round((e.loaded / e.total) * 100) : 0;
                    document.getElementById('status-message').textContent = "در حال ذخیره فایل‌ها در کش: " + percent + "%";
                }, false);
                
                window.applicationCache.oncached = function() {
                    document.getElementById('status-message').textContent = "کش آفلاین با موفقیت ذخیره شد.";
                };
                window.applicationCache.onupdateready = function() {
                    document.getElementById('status-message').textContent = "آپدیت جدید کش ذخیره شد.";
                };
            }
            
            if (window.cacheGate) {
                window.cacheGate.init();
                window.cacheGate.whenReady(() => {
                    if (typeof autoJailbreak === 'function') {
                        autoJailbreak();
                    }
                });
            } else {
                if (typeof autoJailbreak === 'function') {
                    autoJailbreak();
                }
            }
        });
    </script>
</body>
</html>
