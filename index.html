<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>GAMELAND</title>
    <link rel="stylesheet" href="./includes/css/layouts/index.css">
    <link rel="stylesheet" href="./includes/css/colors/default.css">
    <link rel="stylesheet" href="./includes/css/colors/vibrant.css">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://gameland125.github.io">
    <link rel="preconnect" href="https://qassemakbarzadeh.github.io">
</head>

<body>
    <div id="preloader">
        <div id="status">
            <div class="preloader">
                <span class="dot"></span>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-sm-12 col-md-12 col-lg-12">
                <div class="panel-heading">
                    <h4 class="panel-title">GAMELAND <span style="font-size: 15px;">Powered by Qassem Akbarzadeh</span>
                    </h4>
                </div>

                <div class="block-content">
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <div class="col-xs-12">
                                        <button type="button" id="btn-exploit" class="btn btn-block btn-lg btn-primary">
                                            <span id="btn-exploit-text">Loading...</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <div class="col-xs-12">
                                        <div id="autoJbRetry" class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="autoJbRetrySwitch" checked>
                                            <label class="custom-control-label" for="autoJbRetrySwitch" id="autoJbRetryLabel">Auto Jailbreak</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="exploitProgress"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="payloadProgress"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="settingsPopup">
                                <button type="button" id="btn-settings" class="btn btn-block btn-lg btn-info">Settings</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="updatePopup">
                                <button type="button" id="btn-update" class="btn btn-block btn-lg btn-warning">Update</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="restartPopup">
                                <button type="button" id="btn-restart" class="btn btn-block btn-lg btn-danger">Restart</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="continuePopup">
                                <button type="button" id="btn-continue" class="btn btn-block btn-lg btn-success">Continue</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="errorPopup">
                                <button type="button" id="btn-error" class="btn btn-block btn-lg btn-default">Error</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="stopAutoJbBtn">
                                <button type="button" id="btn-stop-auto-jb" class="btn btn-block btn-lg btn-default">Stop Auto Jailbreak</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="clickToStartText"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="networkStatus"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="payloads"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="progress"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="loader"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="changelog"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="update_log"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="jailbreak-status"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="logs"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="messages"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="firmware-log"></div>
                        </div>
                    </div>
                    <div class="form-group text-center">
                        <div class="col-xs-12">
                            <div id="error-log"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./includes/js/design.js"></script>
    <script src="./includes/js/events.js"></script>
    <script src="./includes/js/checkFw.js"></script>
    <script src="./includes/js/language.js"></script>
    <script src="./includes/js/HENs.js"></script>
    <script src="./includes/js/payloadsList.js"></script>
    <script src="./includes/js/autoJbRetry.js"></script>
    <script src="./includes/js/exploits/bundle.js"></script>

    <!-- Choose index.js or index-legacy.js for older browsers, generated with Babel -->
    <script src="./includes/js/cacheGate.js"></script>
    <script id="main-logic-loader">
        (function () {
            var isModern = 'noModule' in document.createElement('script');
            var scriptPath = isModern ? './includes/js/index.js' : './includes/js/index-legacy.js';
            document.write('<script src="' + scriptPath + '"><\/script>');
        })();
    </script>
</body>
</html>
