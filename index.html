body {

.container {

    border: 1px solid #ff007f;

}
h1 {
    font-size: 2.2rem;

}
.brand-name {
    color: #ff007f;
    text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
}
.info-text {
    font-size: 0.9rem;
    color: #8c8c96;
    margin-top: 5px;

}
#status-area {
    margin-top: 25px;

    background: #18181b;

}
.status-title {

}
.progress-bar-container {
    width: 100%;
    height: 8px;
    background-color: #27272a;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 10px;
}
.progress-bar-fill {
    width: 0%;
    height: 100%;
    background-color: #ff007f;

}
.btn-goldhen {

    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 4px 14px rgba(255, 0, 127, 0.4);
    transition: all 0.2s ease;
}
.btn-goldhen:hover {
    background-color: #e00070;
    transform: translateY(-2px);
}
.hidden {
    display: none !important;
}

    </style>
  <script src="includes/js/cacheGate.js"></script>

  <style>
    :root { --accent: #ff007f; --bg: #101010; --panel: #1a1a1a; --text: #f2f2f2; --muted: #a7a7a7; }
    html, body { background: linear-gradient(180deg, #0b0b0b 0%, #141414 100%) !important; color: var(--text) !important; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important; }
    #, #, #cache-status, #stop-auto-jailbreak, ., ., .cache-status { display: none !important; }
    #cache-progress, #status-area, #run-btn, #status-msg, #status-title, #progress-container, #progress-fill { display: block !important; }
    #status-area { background: transparent !important; border: 0 !important; box-shadow: none !important; }
    #status-title, #status-msg, #progress-text, #temp, #log, #clickToStartText { color: var(--text) !important; }
    #progress-fill { background: var(--accent) !important; }
    #run-btn { background: var(--accent) !important; color: #fff !important; border: 0 !important; }
    .brand-line { font-size: clamp(18px, 3vw, 34px); font-weight: 800; letter-spacing: 0; color: var(--text); margin: 12px 0 4px; }

<body>
    <div class="container">
        <h1>گیم لند <span class="brand-name">ترابی ۱۵</span></h1>
        <p class="info-text">مدیریت: قاسم اکبرزاده | تلفن: 09364229748</p>
        <p class="info-text" style="font-size: 0.8rem;">آدرس: کاشمر، خیابان ترابی ۱۵</p>

        <div id="status-area">
            <div id="status-title" class="status-title">در حال بررسی وضعیت سیستم...</div>
            <div id="status-msg" class="info-text">آماده‌سازی لودر آفلاین...</div>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <button id="run-btn" class="btn-goldhen hidden" onclick="startJailbreakProcess()">اجرای GoldHEN</button>

        <div id="msgs"></div>
        <div id="temp"></div>
        <div id="log"></div>
        <span id="clickToStartText"></span>
    </div>

    <script>
        // Progress and cache management
        function DLProgress(e) {
            var percent = Math.round((e.loaded / e.total) * 100);
            document.getElementById('status-title').innerText = "در حال ذخیره‌سازی کش آفلاین...";
            document.getElementById('status-msg').innerText = percent + "% دریافت شد. پس از اتمام، صفحه خودکار بارگذاری می‌شود.";
            document.getElementById('progress-fill').style.width = percent + "%";
        }

        function DisplayCacheProgress() {
            document.getElementById('status-title').innerText = "حافظه پنهان با موفقیت نصب شد!";
            document.getElementById('status-msg').innerText = "در حال هدایت به صفحه اصلی...";
            document.getElementById('progress-fill').style.width = "100%";
            setTimeout(function() {
                window.location.reload();
            }, 1500);
        }

        if (window.applicationCache) {
            window.applicationCache.addEventListener("progress", DLProgress, false);
            window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
            window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
        }

        function startJailbreakProcess() {
            document.getElementById('status-title').innerText = "در حال اجرای جیلبریک...";
            document.getElementById('status-msg').innerText = "لطفا منتظر بمانید، این فرآیند خودکار است...";
            document.getElementById('run-btn').classList.add('hidden');
            if (typeof jailbreak === 'function') {
                jailbreak();
            } else {
                // Fallback to core index.js trigger
                var evt = new Event('click');
                var btn = document.getElementById('run-btn');
                if(btn) btn.dispatchEvent(evt);
            }
        }

        // Auto trigger jailbreak on load if cache ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                var cacheStatus = window.applicationCache ? window.applicationCache.status : 0;
                // status 1 = IDLE (cached and ready)
                if (cacheStatus === 1 || cacheStatus === 4) {
                    document.getElementById('status-title').innerText = "کش آماده است. در حال اجرای خودکار GoldHEN...";
                    document.getElementById('progress-container').classList.add('hidden');
                    startJailbreakProcess();
                } else {
                    document.getElementById('run-btn').classList.remove('hidden');
                }
            }, 1000);
        });
    </script>
