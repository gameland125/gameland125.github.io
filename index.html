<html lang="fa" manifest="PSFree.manifest">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gameland</title>
</head>
<body>
<script>
function startJailbreakProcess() {
  if (typeof jailbreak === 'function') {
    jailbreak();
  } else {
    var evt = new Event('click');
    var btn = document.getElementById('run-btn');
    if(btn) btn.dispatchEvent(evt);
  }
}
window.addEventListener('load', function() {
  var params = new URLSearchParams(location.search);
  var cached = params.get('cached') === '1';
  if (cached) {
    setTimeout(startJailbreakProcess, 50);
    return;
  }
  setTimeout(function() {
    var cacheStatus = window.applicationCache ? window.applicationCache.status : 0;
    if (cacheStatus === 1 || cacheStatus === 4) {
      startJailbreakProcess();
    } else {
      var btn = document.getElementById('run-btn');
      if (btn) btn.classList.remove('hidden');
    }
  }, 1000);
});
</script>
<script src="includes/js/autoJbRetry.js"></script>
<script type="module" src="index.js"></script>
</body>
</html>
