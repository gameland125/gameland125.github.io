<!DOCTYPE html>
<html lang="fa" manifest="PSFree.manifest">
<head>
    <meta charset="UTF-8">
    <title>گیم لند - نصب حافظه موقت</title>
    <style>
    
body {
    background-color: #0b0b0c;
    color: #e2e2e6;
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    direction: rtl;
    text-align: center;
}
.container {
    width: 90%;
    max-width: 600px;
    padding: 30px;
    background: #121214;
    border: 1px solid #ff007f;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.15);
}
h1 {
    font-size: 2.2rem;
    color: #ffffff;
    margin-bottom: 5px;
    font-weight: 800;
}
.brand-name {
    color: #ff007f;
    text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
}
.info-text {
    font-size: 0.9rem;
    color: #8c8c96;
    margin-top: 5px;
    line-height: 1.6;
}
#status-area {
    margin-top: 25px;
    padding: 15px;
    background: #18181b;
    border-radius: 8px;
    border: 1px solid #27272a;
}
.status-title {
    font-size: 1.1rem;
    color: #ff007f;
    margin-bottom: 10px;
    font-weight: 600;
}
.progress-bar-container {
    width: 100%;
    height: 8px;
    background-color: #27272a;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 10px;
}
.progress-bar-fill {
    width: 0%;
    height: 100%;
    background-color: #ff007f;
    transition: width 0.3s ease;
}
.btn-goldhen {
    display: inline-block;
    background-color: #ff007f;
    color: white;
    border: none;
    padding: 12px 35px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 4px 14px rgba(255, 0, 127, 0.4);
    transition: all 0.2s ease;
}
.btn-goldhen:hover {
    background-color: #e00070;
    transform: translateY(-2px);
}
.hidden {
    display: none !important;
}

    </style>
    <script>
        function DLProgress(e) {
            var percent = Math.round((e.loaded / e.total) * 100);
            document.getElementById('status-title').innerText = "در حال نصب کش آفلاین گیم لند...";
            document.getElementById('status-msg').innerText = percent + "% دانلود شد.";
            document.getElementById('progress-fill').style.width = percent + "%";
        }
        function DisplayCacheProgress() {
            document.getElementById('status-title').innerText = "نصب با موفقیت انجام شد!";
            document.getElementById('status-msg').innerText = "سیستم آماده کار به صورت آفلاین است. در حال هدایت...";
            document.getElementById('progress-fill').style.width = "100%";
            setTimeout(function() {
                window.location.replace('./index.html?cached=1');
            }, 1500);
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    </script>
</head>
<body>
    <div class="container">
        <h1>گیم لند <span class="brand-name">ترابی ۱۵</span></h1>
        <p class="info-text">مدیریت: قاسم اکبرزاده | تلفن: 09364229748</p>
        <div id="status-area">
            <div id="status-title" class="status-title">در حال شروع نصب کش...</div>
            <div id="status-msg" class="info-text">لطفا منتظر بمانید تا فایل‌ها ذخیره شوند...</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>
</body>
</html>
